[package]
name = "stacc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust TUI control panel and metadata sync for stacc agent configs"

[[bin]]
name = "stacc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
include_dir = "0.7.4"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
