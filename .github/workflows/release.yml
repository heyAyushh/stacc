name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            binary: stacc
          - os: macos-14
            target: aarch64-apple-darwin
            binary: stacc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: stacc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: stacc.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          archive_root="dist/stacc-${{ matrix.target }}"
          mkdir -p "${archive_root}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${archive_root}/"
          tar -czf "stacc-${{ matrix.target }}.tar.gz" -C dist "stacc-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: stacc-${{ matrix.target }}
          path: stacc-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --generate-notes
          fi
          find release-assets -type f -name 'stacc-*.tar.gz' -print0 |
            xargs -0 gh release upload "${tag}" --clobber
